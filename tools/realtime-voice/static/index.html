<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="realtime-session-id" content="__REALTIME_SESSION_ID__">
  <title>即時語音接案神</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; background: #f6f7f9; color: #1b2430; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    .recording-page { width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    .page-header, .control-row, .transcript-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); }
    h2 { font-size: 1.15rem; }
    .connection-status { color: #8a4b08; font-weight: 700; }
    .connection-status.connected { color: #137333; }
    .card { margin-top: 24px; padding: 22px; border: 1px solid #dce1e8; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px rgb(27 36 48 / 7%); }
    .control-row { justify-content: flex-start; flex-wrap: wrap; }
    button { min-height: 44px; border: 0; border-radius: 10px; padding: 0 20px; background: #175cd3; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button[aria-pressed="true"] { background: #b42318; }
    .recording-state { color: #59636e; }
    .permission-notice { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #fff1f0; color: #b42318; }
    .transcript-header { padding-bottom: 14px; border-bottom: 1px solid #e8ebef; }
    .transcript-count { color: #59636e; font-size: .9rem; }
    .transcript { min-height: 190px; margin: 0; padding: 16px 0 0 24px; }
    .transcript li { padding: 10px 0 10px 6px; border-bottom: 1px solid #f0f2f4; line-height: 1.6; }
    .transcript time { display: block; color: #7b8490; font-size: .78rem; }
    .empty { color: #7b8490; list-style: none; margin-left: -24px; padding-top: 36px; text-align: center; }
    .privacy-note { margin-top: 16px; color: #7b8490; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="recording-page">
    <header class="page-header">
      <h1>即時語音接案神</h1>
      <p class="connection-status" id="advisor-status" aria-live="polite">顧問未連線</p>
    </header>

    <section class="card" aria-labelledby="recording-heading">
      <div class="control-row">
        <button id="toggle" type="button" aria-pressed="false">開始收音</button>
        <p class="recording-state" id="recording-status" aria-live="polite">未收音</p>
      </div>
      <p class="permission-notice" id="permission-notice" role="alert" hidden>需要麥克風權限才能開始收音。請在瀏覽器設定中允許麥克風後再試一次。</p>
      <p class="privacy-note">音檔留在本機；逐字稿由 CLI 顧問依啟動時顯示的後端設定處理。</p>
    </section>

    <section class="card" aria-labelledby="transcript-heading">
      <div class="transcript-header">
        <h2 id="transcript-heading">即時繁中逐字稿</h2>
        <span class="transcript-count" id="transcript-count">0 段</span>
      </div>
      <ol class="transcript" id="transcript" aria-live="polite">
        <li class="empty" id="transcript-empty">開始收音後，逐字稿會出現在這裡。</li>
      </ol>
    </section>
  </main>

  <script>
    (() => {
      const sessionId = document.querySelector('meta[name="realtime-session-id"]')?.content || '';
      const toggle = document.getElementById('toggle');
      const recordingStatus = document.getElementById('recording-status');
      const permissionNotice = document.getElementById('permission-notice');
      const advisorStatus = document.getElementById('advisor-status');
      const transcript = document.getElementById('transcript');
      const transcriptEmpty = document.getElementById('transcript-empty');
      const transcriptCount = document.getElementById('transcript-count');
      const silenceRmsThreshold = 0.02;
      const silenceMsToFlush = 700;
      let socket = null;
      let stream = null;
      let context = null;
      let analyser = null;
      let recorder = null;
      let recording = false;
      let stopRequested = false;
      let hasSpeech = false;
      let silenceStartedAt = null;
      let vadFrame = null;
      let cleanupTimer = null;
      let stopNotified = false;

      async function updateAdvisorStatus() {
        if (!sessionId || sessionId === '__REALTIME_' + 'SESSION_ID__') return;
        try {
          const response = await fetch(`/advisor-status/${encodeURIComponent(sessionId)}`, { cache: 'no-store' });
          const data = await response.json();
          const connected = data.connected === true || data.status === 'connected';
          advisorStatus.textContent = connected ? '顧問已連線' : '顧問未連線';
          advisorStatus.classList.toggle('connected', connected);
        } catch (_) {
          advisorStatus.textContent = '顧問未連線';
          advisorStatus.classList.remove('connected');
        }
      }
      updateAdvisorStatus();
      window.setInterval(updateAdvisorStatus, 2000);

      function appendTranscript(text, timestamp) {
        transcriptEmpty.hidden = true;
        const item = document.createElement('li');
        const time = document.createElement('time');
        time.dateTime = timestamp || new Date().toISOString();
        time.textContent = new Date(timestamp || Date.now()).toLocaleTimeString('zh-TW');
        const body = document.createElement('span');
        body.textContent = text;
        item.append(time, body);
        transcript.appendChild(item);
        transcriptCount.textContent = `${transcript.querySelectorAll('li:not(.empty)').length} 段`;
        transcript.scrollTop = transcript.scrollHeight;
      }

      function notifySessionStop() {
        if (stopNotified || !sessionId || sessionId === '__REALTIME_' + 'SESSION_ID__') return;
        stopNotified = true;
        fetch(`/session-stop/${encodeURIComponent(sessionId)}`, { method: 'POST' }).catch(() => {});
      }

      function cleanup() {
        if (cleanupTimer) { window.clearTimeout(cleanupTimer); cleanupTimer = null; }
        if (vadFrame) { window.cancelAnimationFrame(vadFrame); vadFrame = null; }
        if (stream) { stream.getTracks().forEach((track) => track.stop()); stream = null; }
        if (socket) { socket.close(); socket = null; }
        if (context) { context.close(); context = null; }
        recording = false;
        toggle.disabled = false;
        toggle.textContent = '開始收音';
        toggle.setAttribute('aria-pressed', 'false');
        recordingStatus.textContent = '已停止';
        notifySessionStop();
      }

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        socket = new WebSocket(`${protocol}://${location.host}/stream`);
        socket.binaryType = 'arraybuffer';
        socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          appendTranscript(data.text, data.ts);
          if (stopRequested) cleanup();
        };
        socket.onerror = () => { recordingStatus.textContent = '連線失敗'; };
      }

      function startRecorder() {
        const segmentChunks = [];
        const nextRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        recorder = nextRecorder;
        nextRecorder.ondataavailable = (event) => { if (event.data.size > 0) segmentChunks.push(event.data); };
        nextRecorder.onstop = () => {
          const blob = new Blob(segmentChunks, { type: 'audio/webm' });
          blob.arrayBuffer().then((buffer) => {
            if (socket && socket.readyState === WebSocket.OPEN) socket.send(buffer);
          });
        };
        nextRecorder.start();
        hasSpeech = false;
        silenceStartedAt = null;
      }

      function flushRecorder() {
        if (recorder && recorder.state === 'recording') recorder.stop();
        if (recording) startRecorder();
      }

      function rms(data) {
        let sum = 0;
        for (let index = 0; index < data.length; index += 1) {
          const value = (data[index] - 128) / 128;
          sum += value * value;
        }
        return Math.sqrt(sum / data.length);
      }

      function vadLoop() {
        const data = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(data);
        const level = rms(data);
        const now = performance.now();
        if (level > silenceRmsThreshold) {
          hasSpeech = true;
          silenceStartedAt = null;
        } else if (hasSpeech) {
          if (silenceStartedAt === null) silenceStartedAt = now;
          if (now - silenceStartedAt > silenceMsToFlush) flushRecorder();
        }
        vadFrame = window.requestAnimationFrame(vadLoop);
      }

      async function start() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (_) {
          permissionNotice.hidden = false;
          recordingStatus.textContent = '需要麥克風權限';
          return;
        }
        permissionNotice.hidden = true;
        context = new AudioContext();
        const source = context.createMediaStreamSource(stream);
        analyser = context.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);
        connect();
        recording = true;
        stopRequested = false;
        stopNotified = false;
        startRecorder();
        vadLoop();
        toggle.textContent = '停止收音';
        toggle.setAttribute('aria-pressed', 'true');
        recordingStatus.textContent = '收音中';
      }

      function stop() {
        recording = false;
        stopRequested = true;
        if (vadFrame) { window.cancelAnimationFrame(vadFrame); vadFrame = null; }
        recordingStatus.textContent = '收尾中…';
        if (recorder && recorder.state === 'recording') {
          recorder.stop();
          cleanupTimer = window.setTimeout(cleanup, 5000);
        } else {
          cleanup();
        }
      }

      toggle.addEventListener('click', () => { if (recording) stop(); else start(); });
    })();
  </script>
</body>
</html>
